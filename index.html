<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWR Luxury | SWR Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&family=Noto+Sans+Arabic:wght@300;600&display=swap');
        
        body { font-family: 'Tajawal', sans-serif; transition: all 0.6s ease; overflow-x: hidden; background-color: #050505; color: #ffffff; }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
        }

        .swr-mode { background-color: #450a0a; color: #fecaca; }
        .light-mode { background-color: #f8fafc; color: #1e293b; }
        
        #splash { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 100; }
        .fade-in { animation: fadeIn 0.8s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="splash" class="fixed inset-0 flex items-center justify-center flex-col p-6 text-center">
        <div class="text-red-600 mb-6 text-6xl animate-bounce"><i class="fas fa-scissors"></i></div>
        <h1 class="text-white text-4xl font-black mb-12 tracking-widest">SWR BARBER</h1>
        <p class="text-gray-400 mb-6">CHOOSE YOUR LANGUAGE / زمانی خۆت هەڵبژێرە</p>
        <div class="flex flex-col gap-4 w-full max-w-xs">
            <button onclick="setLanguage('ar')" class="py-4 glass text-white hover:bg-yellow-600 transition font-bold text-xl">العربية</button>
            <button onclick="setLanguage('ku')" class="py-4 glass text-white hover:bg-red-700 transition font-bold text-xl">کوردی</button>
            <button onclick="setLanguage('en')" class="py-4 glass text-white hover:bg-blue-700 transition font-bold text-xl">English</button>
        </div>
    </div>

    <div id="app" class="hidden min-h-screen">
        <nav class="p-6 flex justify-between items-center">
            <div class="text-3xl font-black text-yellow-500" id="logo">SWR.</div>
            <div class="flex gap-2">
                <button onclick="toggleMode('light')" class="w-10 h-10 glass flex items-center justify-center"><i class="fas fa-sun text-orange-400"></i></button>
                <button onclick="toggleMode('swr')" class="w-10 h-10 glass flex items-center justify-center"><i class="fas fa-fire text-red-500"></i></button>
            </div>
        </nav>

        <header class="flex flex-col items-center mt-8 text-center px-6">
            <div class="relative">
                <div class="absolute inset-0 bg-yellow-500 rounded-full blur-2xl opacity-20"></div>
                <img src="https://i.imgur.com/zfHGwOf.jpeg" class="w-40 h-40 rounded-full object-cover border-4 border-yellow-500 shadow-2xl relative">
            </div>
            
            <h2 id="main-name" class="text-4xl font-extrabold mt-8">07703637218</h2>
            
            <div id="kurdish-exclusive" class="hidden mt-4 space-y-1">
                <p class="text-xl text-yellow-500">پێزگاری دەبێت</p>
                <p class="text-2xl text-red-500 font-bold">VIP پێستی تیدی</p>
            </div>

            <p id="main-title" class="text-yellow-500 tracking-widest font-light mt-4 uppercase"></p>

            <div class="flex gap-8 mt-10 text-3xl">
                <a href="https://instagram.com/ako_kako" class="hover:scale-125 transition"><i class="fab fa-instagram"></i></a>
                <a href="https://www.facebook.com/share/1M5VGUhoiW/" class="hover:scale-125 transition"><i class="fab fa-facebook"></i></a>
                <a href="https://wa.me/9647703637218" class="text-green-500 hover:scale-125 transition"><i class="fab fa-whatsapp"></i></a>
            </div>
        </header>

        <section class="p-6 mt-12 max-w-md mx-auto">
            <div class="glass p-8 shadow-2xl fade-in">
                <h3 id="form-head" class="text-2xl font-bold mb-8 text-center"></h3>
                <div class="space-y-4">
                    <input type="text" id="userName" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 focus:border-yellow-500" placeholder="">
                    <input type="datetime-local" id="bookDate" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 focus:border-yellow-500">
                    <button onclick="send()" id="submit-btn" class="w-full py-5 bg-yellow-600 text-black font-black rounded-2xl hover:bg-yellow-500 transition shadow-xl uppercase"></button>
                </div>
            </div>
        </section>
        
        <div class="text-center py-10">
            <button onclick="location.reload()" class="text-xs text-gray-500 underline">تغيير اللغة / Change Language</button>
        </div>
    </div>

    <script>
        const content = {
            ar: { title: "حلاق SWR الفاخر", head: "حجز موعد VIP", placeholder: "الاسم الثلاثي", btn: "تأكيد عبر واتساب", dir: "rtl", kurdish: false },
            ku: { title: "سەرتاشخانەی SWR", head: "بڕینی نۆره‌ی VIP", placeholder: "ناوی سیانی", btn: "ناردن بۆ واتسئاپ", dir: "rtl", kurdish: true },
            en: { title: "SWR LUXURY BARBER", head: "BOOK VIP NOW", placeholder: "Full Name", btn: "CONFIRM WHATSAPP", dir: "ltr", kurdish: false }
        };

        function setLanguage(lang) {
            const data = content[lang];
            document.documentElement.dir = data.dir;
            document.getElementById('main-title').innerText = data.title;
            document.getElementById('form-head').innerText = data.head;
            document.getElementById('userName').placeholder = data.placeholder;
            document.getElementById('submit-btn').innerText = data.btn;
            
            // إظهار السطور الكردية فقط إذا تم اختيار الكردية
            const kuDiv = document.getElementById('kurdish-exclusive');
            if(data.kurdish) kuDiv.classList.remove('hidden');
            else kuDiv.classList.add('hidden');

            document.getElementById('splash').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
        }

        function toggleMode(mode) {
            document.body.classList.remove('swr-mode', 'light-mode');
            if(mode !== 'dark') document.body.classList.add(mode + '-mode');
        }

        function send() {
            const name = document.getElementById('userName').value;
            const date = document.getElementById('bookDate').value;
            if(!name || !date) return alert("يرجى ملء البيانات / تکایە زانیارییەکان پڕ بکەرەوە");
            window.open(`https://wa.me/9647703637218?text=SWR Booking:%0AName: ${name}%0ADate: ${date}`, '_blank');
        }
    </script>
</body>
</html>
